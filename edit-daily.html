<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日次業務の編集 | Pharmacy OS</title>
<link rel="stylesheet" href="edit.css?v=4">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <p class="eyebrow">PHARMACY OS</p>
      <h1>日次業務の編集</h1>
      <p>過去の日報を修正・削除できます。</p>
      <button id="reload-button" class="reload-button" type="button" aria-label="再読み込み">↻</button>
    </header>

    <a class="text-button" href="edit.html">← 編集トップに戻る</a>
    <p id="edit-loading" class="loading-message" aria-live="polite">データを読み込んでいます…</p>

    <section id="daily-edit-section" class="card">
      <div class="section-heading">
        <div><p class="section-label">DAILY REPORTS</p><h2>日次業務</h2></div>
      </div>
      <div id="daily-edit-list" class="stack-list"><p class="empty-message">読み込み中です。</p></div>
    </section>
  </main>

  <div id="daily-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="daily-modal-title">
      <div class="modal-head"><button class="text-button" type="button" data-close-modal>← 戻る</button><h2 id="daily-modal-title">日報を編集</h2></div>
      <form id="daily-edit-form">
        <input id="daily-edit-id" type="hidden">
        <label>日付 <b>*</b><input id="daily-edit-date" type="date" required></label>
        <label class="checkbox-field"><input id="daily-edit-closed" type="checkbox"> 休業日として記録する</label>
        <label>開局時間<input id="daily-edit-hours" placeholder="例：08:45～18:00"></label>
        <label>処方箋枚数<input id="daily-edit-count" type="number" step="1"></label>
        <label>管理者不在時間<input id="daily-edit-manager-absence" placeholder="例：12:00～13:00"></label>
        <label>管理者不在時対応者<input id="daily-edit-manager-responder"></label>
        <label>薬剤師不在時間<input id="daily-edit-pharmacist-absence" placeholder="例：12:00～13:00"></label>
        <label>薬剤師不在時対応者<input id="daily-edit-pharmacist-responder"></label>
        <label>特記事項<textarea id="daily-edit-notes" rows="2"></textarea></label>
        <label>申し送り<textarea id="daily-edit-handover" rows="2"></textarea></label>
        <label>確認印
          <select id="daily-edit-confirmed">
            <option value="">未選択</option>
          </select>
        </label>
        <div class="form-actions"><button id="daily-edit-delete-button" class="danger-button" type="button">削除する</button><button class="secondary-button" type="button" data-close-modal>キャンセル</button><button class="primary-button" type="submit">保存する</button></div>
      </form>
    </section>
  </div>

  <div id="delete-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-delete></div>
    <section class="confirm-panel" role="alertdialog" aria-modal="true">
      <div class="warning-icon">!</div><h2 id="delete-modal-title">削除しますか？</h2><p id="delete-target-name"></p><p class="muted">この操作は取り消せません。</p>
      <button id="confirm-delete" class="danger-button" type="button">削除する</button><button class="secondary-button" type="button" data-close-delete>キャンセル</button>
    </section>
  </div>

  <nav class="bottom-nav" aria-label="メインメニュー">
    <a class="nav-item" href="home.html"><span>⌂</span><small>ホーム</small></a>
    <a class="nav-item" href="index.html"><span>▣</span><small>日次業務</small></a>
    <a class="nav-item" href="monthly.html"><span>▦</span><small>月次業務</small></a>
    <a class="nav-item" href="yearly.html"><span>▤</span><small>年度実績</small></a>
    <a class="nav-item" href="status.html"><span>◉</span><small>ステータス</small></a>
    <a class="nav-item active" href="edit.html" aria-current="page"><span>✎</span><small>編集</small></a>
  </nav>

<script src="config.js"></script>
<script src="edit-daily.js?v=1"></script>
</body>
</html>
