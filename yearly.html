<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>年度実績 | Pharmacy OS</title>
<link rel="stylesheet" href="yearly.css?v=3">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <p class="eyebrow">PHARMACY OS</p>
      <h1>年度実績</h1>
      <p>月次業務の実績を確認できます。数値の入力・修正は「編集」ページから行ってください。</p>
      <button id="reload-button" class="reload-button" type="button" aria-label="再読み込み">↻</button>
    </header>

    <p id="yearly-loading" class="loading-message" aria-live="polite">データを読み込んでいます…</p>

    <div id="compact-view">
      <div class="section-heading">
        <div><p class="section-label">RECENT</p><h2>直近3ヶ月</h2></div>
        <button id="show-full-button" class="primary-small" type="button">詳細を見る</button>
      </div>
      <div id="compact-list" class="stack-list"></div>
    </div>

    <div id="full-view" hidden>
      <button id="back-to-compact-button" class="text-button" type="button">← 直近3ヶ月に戻る</button>

      <nav class="edit-tabs" aria-label="実績分類">
        <button class="edit-tab active" data-target="generic-yearly-section">後発品調剤率</button>
        <button class="edit-tab" data-target="concentration-yearly-section">処方箋集中率</button>
        <button class="edit-tab" data-target="insurance-yearly-section">保険調剤実績</button>
        <button class="edit-tab" data-target="homecare-yearly-section">在宅患者管理</button>
        <button class="edit-tab" data-target="survey-yearly-section">処方箋調べ</button>
      </nav>

      <section id="generic-yearly-section" class="card yearly-section">
        <p class="section-label">GENERIC RATE</p><h2>後発品調剤率</h2>
        <div id="generic-yearly-list" class="stack-list"><p class="empty-message">読み込み中です。</p></div>
      </section>

      <section id="concentration-yearly-section" class="card yearly-section" hidden>
        <p class="section-label">CONCENTRATION</p><h2>処方箋集中率</h2>
        <div id="concentration-yearly-list" class="stack-list"><p class="empty-message">読み込み中です。</p></div>
      </section>

      <section id="insurance-yearly-section" class="card yearly-section" hidden>
        <p class="section-label">INSURANCE</p><h2>保険調剤実績</h2>
        <div id="insurance-yearly-list" class="stack-list"><p class="empty-message">読み込み中です。</p></div>
      </section>

      <section id="homecare-yearly-section" class="card yearly-section" hidden>
        <p class="section-label">HOMECARE</p><h2>在宅患者への薬学的管理</h2>
        <div id="homecare-yearly-list" class="stack-list"><p class="empty-message">読み込み中です。</p></div>
      </section>

      <section id="survey-yearly-section" class="card yearly-section" hidden>
        <p class="section-label">PRESCRIPTION SURVEY</p><h2>処方箋枚数・受付回数等調べ</h2>
        <div id="survey-yearly-list" class="stack-list"><p class="empty-message">読み込み中です。</p></div>
      </section>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="メインメニュー">
    <a class="nav-item" href="home.html"><span>⌂</span><small>ホーム</small></a>
    <a class="nav-item" href="index.html"><span>▣</span><small>日次業務</small></a>
    <a class="nav-item" href="monthly.html"><span>▦</span><small>月次業務</small></a>
    <a class="nav-item active" href="yearly.html" aria-current="page"><span>▤</span><small>年度実績</small></a>
    <a class="nav-item" href="status.html"><span>◉</span><small>ステータス</small></a>
    <a class="nav-item" href="edit.html"><span>✎</span><small>編集</small></a>
  </nav>

<script src="yearly.js?v=3"></script>
</body>
</html>
