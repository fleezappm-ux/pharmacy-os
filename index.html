<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#176b55">
    <meta
      name="description"
      content="薬局の日次業務をスマートフォンから記録する入力画面です。"
    >
    <title>Pharmacy OS | 日次業務入力</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>

  <body>
    <main class="page">
      <section class="app-card" aria-labelledby="page-title">
        <header class="app-header">
          <a class="home-link" href="home.html">← 薬局ホーム</a>
          <p class="app-label">Pharmacy OS</p>
          <h1 id="page-title">日次業務入力</h1>
          <p class="app-description">業務内容を入力してNotionへ保存します。</p>
        </header>

        <form id="daily-form" novalidate>
          <section class="form-section" aria-labelledby="basic-heading">
            <h2 id="basic-heading">基本情報</h2>

            <div class="form-field">
              <label for="date">日付</label>
              <input id="date" name="date" type="date" required>
            </div>

            <div class="form-field">
              <label for="opening-type">開局時間</label>
              <select id="opening-type" name="openingType">
                <option value="normal">通常営業時間</option>
                <option value="custom">当番薬局・任意設定</option>
              </select>
              <p id="opening-summary" class="field-note"></p>
            </div>

            <div id="custom-opening-fields" class="conditional-panel" hidden>
              <div class="time-range">
                <div class="form-field">
                  <label for="opening-start">開始</label>
                  <input id="opening-start" name="openingStart" type="time">
                </div>
                <span class="range-separator" aria-hidden="true">～</span>
                <div class="form-field">
                  <label for="opening-end">終了</label>
                  <input id="opening-end" name="openingEnd" type="time">
                </div>
              </div>
            </div>

            <div class="form-field">
              <label for="prescription-count">処方箋枚数</label>
              <div class="input-with-unit">
                <input
                  id="prescription-count"
                  name="prescriptionCount"
                  type="number"
                  inputmode="numeric"
                  min="0"
                  step="1"
                  placeholder="0"
                  required
                >
                <span aria-hidden="true">枚</span>
              </div>
            </div>
          </section>

          <section class="form-section" aria-labelledby="absence-heading">
            <h2 id="absence-heading">不在時間</h2>

            <div class="form-field">
              <label for="manager-absence">管理者不在</label>
              <select id="manager-absence" name="managerAbsenceEnabled">
                <option value="no">なし</option>
                <option value="yes">あり</option>
              </select>
            </div>

            <div id="manager-absence-fields" class="conditional-panel" hidden>
              <div class="time-range">
                <div class="form-field">
                  <label for="manager-start">開始</label>
                  <input id="manager-start" name="managerStart" type="time">
                </div>
                <span class="range-separator" aria-hidden="true">～</span>
                <div class="form-field">
                  <label for="manager-end">終了</label>
                  <input id="manager-end" name="managerEnd" type="time">
                </div>
              </div>
              <div class="form-field">
                <label for="manager-responder">不在時対応者</label>
                <input
                  id="manager-responder"
                  name="managerResponder"
                  type="text"
                  autocomplete="off"
                  placeholder="例：薬剤師 山田"
                >
              </div>
            </div>

            <div class="form-field">
              <label for="pharmacist-absence">薬剤師不在</label>
              <select id="pharmacist-absence" name="pharmacistAbsenceEnabled">
                <option value="no">なし</option>
                <option value="yes">あり</option>
              </select>
            </div>

            <div id="pharmacist-absence-fields" class="conditional-panel" hidden>
              <div class="time-range">
                <div class="form-field">
                  <label for="pharmacist-start">開始</label>
                  <input id="pharmacist-start" name="pharmacistStart" type="time">
                </div>
                <span class="range-separator" aria-hidden="true">～</span>
                <div class="form-field">
                  <label for="pharmacist-end">終了</label>
                  <input id="pharmacist-end" name="pharmacistEnd" type="time">
                </div>
              </div>
              <div class="form-field">
                <label for="pharmacist-responder">不在時対応者</label>
                <input
                  id="pharmacist-responder"
                  name="pharmacistResponder"
                  type="text"
                  autocomplete="off"
                  placeholder="例：事務 山田"
                >
              </div>
            </div>
          </section>

          <section class="form-section" aria-labelledby="notes-heading">
            <h2 id="notes-heading">記録・申し送り</h2>

            <div class="form-field">
              <label for="inquiry">疑義照会</label>
              <select id="inquiry" name="inquiryOccurred">
                <option value="no">なし</option>
                <option value="yes">あり</option>
              </select>
            </div>

            <div id="inquiry-fields" class="conditional-panel" hidden>
              <div class="form-field">
                <label for="inquiry-details">疑義照会の詳細</label>
                <textarea
                  id="inquiry-details"
                  name="inquiryDetails"
                  rows="4"
                  placeholder="照会内容と回答、対応結果など"
                ></textarea>
              </div>
            </div>

            <div class="form-field">
              <label for="special-notes">その他の特記事項</label>
              <textarea
                id="special-notes"
                name="specialNotes"
                rows="3"
                placeholder="必要な場合のみ入力"
              ></textarea>
            </div>

            <div class="form-field">
              <label for="handover">申し送り</label>
              <textarea
                id="handover"
                name="handover"
                rows="4"
                placeholder="翌日以降へ引き継ぐ内容"
              ></textarea>
            </div>

            <div class="form-field">
              <label for="confirmed-by">確認者</label>
              <select id="confirmed-by" name="confirmedBy">
                <option value="">未選択</option>
                <option value="降旗敏文">降旗敏文</option>
                <option value="藤川律子">藤川律子</option>
                <option value="金井佳美">金井佳美</option>
                <option value="井内淳一郎">井内淳一郎</option>
                <option value="井内学">井内学</option>
              </select>
            </div>
          </section>

          <button id="submit-button" type="submit">Notionへ保存</button>
          <p id="status-message" class="status-message" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <noscript>
      <p class="noscript-message">
        このアプリを使用するにはJavaScriptを有効にしてください。
      </p>
    </noscript>
  </body>
</html>
