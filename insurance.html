<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>保険調剤実績 | Pharmacy OS</title>
  <link rel="stylesheet" href="insurance.css?v=2">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <a class="back-link" href="monthly.html">← 月次業務へ戻る</a>
      <p class="eyebrow">PHARMACY OS</p>
      <h1>保険調剤実績</h1>
      <p>対象月の保険調剤実績を入力してNotionへ保存します。</p>
    </header>

    <form id="insurance-form">
      <section class="card">
        <p class="section-label">TARGET MONTH</p>
        <h2>対象月</h2>
        <div class="month-picker">
          <label>
            <span>西暦</span>
            <select id="target-year" required></select>
          </label>
          <label>
            <span>月</span>
            <select id="target-month-number" required></select>
          </label>
        </div>
      </section>

      <section class="card table-card">
        <p class="section-label">INSURANCE RESULTS</p>
        <h2>保険調剤実績</h2>
        <p class="help">未入力の欄は空欄のままで大丈夫です。合計は医科と歯科から自動計算します。</p>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>区分</th>
                <th>件数</th>
                <th>医科（回数）</th>
                <th>歯科（回数）</th>
                <th>合計</th>
                <th>報酬点数</th>
              </tr>
            </thead>
            <tbody id="insurance-rows"></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <p class="section-label">INSTITUTIONS</p>
        <h2>発行医療機関数</h2>
        <div class="institution-grid">
          <label>医科（回数）<input id="institution-medical" type="number" min="0" inputmode="numeric"></label>
          <label>歯科（回数）<input id="institution-dental" type="number" min="0" inputmode="numeric"></label>
          <label>合計<input id="institution-total" type="number" readonly tabindex="-1"></label>
        </div>
      </section>

      <button id="save-button" class="save-button" type="submit">Notionへ保存</button>
      <p id="status-message" class="status-message" aria-live="polite"></p>
    </form>
  </main>
  <script src="insurance.js?v=2"></script>
</body>
</html>
